<!-- Coloca una imagen dentro de un DIV con position: absolute. Crea dos botones: •
Al pulsar uno de ellos la imagen debe moverse 5px hacia la derecha de la
pantalla. • Al pulsar el otro, la imagen debe moverse 5px hacia la izquierda de
la pantalla. Nota: Recuerda la posicion (0,0) de la pagina web al usar
top/left/right/bottom -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="Ejer12.js"></script>
    <style>
      img {
        position: absolute;
        left: 0;
      }
      input {
        position: absolute;
      }
    </style>
    <title>Document</title>
  </head>
  <body>
    <div>
      <img src="cbum.jpeg" alt="" />
      <input type="button" value="Izquierda" />
      <input type="button" value="Derecha" />
  </body>
</html>
